<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexión - Merkamigo</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f4f4;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #1f1f21;
            text-align: center;
            padding: 24px;
        }
        .card { max-width: 28rem; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #4c4c50; line-height: 1.5; }
        button {
            margin-top: 1.5rem;
            background: #d7352a;
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sin conexión</h1>
        <p>
            Parece que no tienes internet en este momento. Merkamigo necesita
            conexión para mostrar vitrinas, la plaza y tu panel actualizados.
            Vuelve a intentarlo cuando tengas señal.
        </p>
        <button onclick="window.location.reload()">Reintentar</button>
    </div>
</body>
</html>
